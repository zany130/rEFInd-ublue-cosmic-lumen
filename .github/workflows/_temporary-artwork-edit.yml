name: Temporary artwork update (remove after use)
on:
  push:
    branches:
      - fix/remove-concept-from-banner
permissions:
  contents: write
jobs:
  update-png:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install temporary raster processing dependencies
        run: python -m pip install --quiet pillow numpy opencv-python-headless
      - name: Update only background.png
        shell: bash
        run: |
          python - <<'PY'
            from PIL import Image
            import numpy as np
            import cv2
            p="background.png"
            a=np.asarray(Image.open(p).convert("RGB")).copy()
            x0,y0,x1,y1=1150,308,1455,370
            mask=np.zeros(a.shape[:2],np.uint8)
            cv2.rectangle(mask,(x0,y0),(x1,y1),255,-1)
            pad=110
            px=max(0,x0-pad); qx=min(a.shape[1],x1+pad)
            py=max(0,y0-pad); qy=min(a.shape[0],y1+pad)
            a[py:qy,px:qx]=cv2.inpaint(a[py:qy,px:qx],mask[py:qy,px:qx],8,cv2.INPAINT_TELEA)
            Image.fromarray(a).save(p,compress_level=6)
          PY
      - name: Commit updated PNG without build scripts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add background.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update final rEFInd wallpaper artwork"
          git push origin HEAD:fix/remove-concept-from-banner
